<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vetus Lodge Daily Sales</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: forest-green app bar carrying the logo, one working column (max 1120px) of panels below; tables scroll inside their own panels */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#F7F9F5; --ink:#15261A; --muted:#5C6B5F; --line:#DBE3D8;
  --brand:#183820; --brand-ink:#FFFFFF; --brand-2:#22492B;
  --red:#C92B28; --green:#2B8F1C; --gold:#A8892C; --gold-line:#C5B361;
  --ok-bg:#E3F3DE; --warn-bg:#FBF0D5; --warn:#8A6410; --bad-bg:#F9E1E0;
  --site1:#2B8F1C; --site2:#C5B361; --site3:#6C7C6F;
  --f-display:"Montserrat","Segoe UI",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1C12; --surface:#152A1B; --surface-2:#1A3221; --ink:#E7EFE5; --muted:#9DAEA0; --line:#294431;
  --brand:#0B170E; --brand-ink:#FFFFFF; --brand-2:#183820;
  --red:#EA5C58; --green:#4FC93A; --gold:#D8C477; --gold-line:#C5B361;
  --ok-bg:#1D3B1C; --warn-bg:#3A3015; --warn:#E3C368; --bad-bg:#45201F;
  --site1:#4FC93A; --site2:#D8C477; --site3:#94A596; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1C12; --surface:#152A1B; --surface-2:#1A3221; --ink:#E7EFE5; --muted:#9DAEA0; --line:#294431;
  --brand:#0B170E; --brand-ink:#FFFFFF; --brand-2:#183820;
  --red:#EA5C58; --green:#4FC93A; --gold:#D8C477; --gold-line:#C5B361;
  --ok-bg:#1D3B1C; --warn-bg:#3A3015; --warn:#E3C368; --bad-bg:#45201F;
  --site1:#4FC93A; --site2:#D8C477; --site3:#94A596; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800} h2{font-size:1.05rem;font-weight:700} h3{font-size:.95rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-line);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .9rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:.25rem .6rem;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.proto{background:var(--gold-line);color:#1C2A10;text-align:center;font-size:.8rem;font-weight:600;padding:.3rem 16px;letter-spacing:.02em}

/* App bar */
.bar{background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--gold-line)}
.bar-in{max-width:1120px;margin:0 auto;padding:.6rem 16px;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.bar img{width:46px;height:46px;object-fit:cover;object-position:center 32%;border-radius:50%;border:2px solid var(--gold-line)}
.bar .name{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;line-height:1.1}
.bar .sub{font-size:.8rem;opacity:.8}
.bar .spacer{flex:1}
.who{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.role-chip{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:99px;background:var(--red);color:#fff}
.bar .btn{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.35)}
.nav{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:.25rem;overflow-x:auto}
.nav button{background:none;border:0;color:var(--brand-ink);opacity:.75;padding:.55rem .8rem;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{opacity:1;border-bottom-color:var(--green)}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:1.25rem 3rem;display:grid;gap:1.1rem}
.head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.head .meta{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;display:grid;gap:.8rem;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.badge{display:inline-grid;place-items:center;min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:99px;background:var(--gold-line,#C5B361);color:#183820;font-size:.72rem;font-weight:800;margin-left:.25rem;vertical-align:1px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:.12rem .55rem;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--green)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--red)} .pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.3rem .65rem;font-size:.85rem;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand-2);color:#fff}
.stripe{border-left:4px solid var(--line);padding-left:.7rem}
.stripe.bad{border-left-color:var(--red)} .stripe.warn{border-left-color:var(--gold-line)} .stripe.ok{border-left-color:var(--green)}
.alerts{display:grid;gap:.6rem}
.sum-row{display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0}
.sum-row.total{border-top:2px solid var(--ink);margin-top:.3rem;padding-top:.5rem;font-weight:700;font-size:1.1rem}
.deposit{background:var(--brand-2);color:#fff;border-radius:var(--radius);padding:1rem;display:grid;gap:.6rem;border:1px solid var(--gold-line)}
.deposit .amt{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.deposit .btn{background:#fff;color:var(--brand);border-color:#fff}
.deposit.done{background:var(--surface);color:var(--ink);border-color:var(--green)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px;background:var(--c)}
form.inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;align-items:end}
label.f{display:grid;gap:.25rem;font-size:.82rem;font-weight:600;color:var(--muted)}
textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;width:100%;min-height:9rem;resize:vertical;line-height:1.45}
a.btn{text-decoration:none;color:inherit}
.modal.wide{max-width:640px}
.gb{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem .8rem;align-items:start;padding:.7rem 0;border-top:1px solid var(--line)}
.gb .k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:5.5rem;padding-top:.15rem}
.gb .t{font-weight:700}.gb .p{font-size:.85rem;color:var(--muted);white-space:pre-line;max-height:3.9em;overflow:hidden}
.gb .acts{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.gb{grid-template-columns:1fr}.gb .acts{justify-content:flex-start}}
input[type=text],input[type=number],input[type=password],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;width:100%;min-width:0}
.err{color:var(--red);font-size:.85rem;font-weight:600}

.panel.branch{text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:.5rem;border-left-width:4px}
.panel.branch:hover{border-color:var(--green)}
.bar .who{color:var(--brand-ink)} .bar .who b{color:var(--gold-line)}
/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:2rem 16px;background:var(--brand)}
.login-card{background:var(--surface);border-radius:14px;max-width:440px;width:100%;overflow:hidden;border:2px solid var(--gold-line)}
.login-card .top{background:var(--brand);padding:1rem;text-align:center}
.login-card .top img{width:200px;max-width:100%;border-radius:8px}
.login-card .body{padding:1.2rem;display:grid;gap:.9rem}
.acct{display:grid;gap:.45rem}
.acct button{display:flex;justify-content:space-between;align-items:center;gap:.6rem;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .75rem;cursor:pointer}
.acct button[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.acct .n{font-weight:700} .acct .r{font-size:.78rem;color:var(--muted)}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,15,8,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:12px;max-width:480px;width:100%;padding:1.2rem;display:grid;gap:.9rem;border-top:4px solid var(--gold-line);max-height:90vh;overflow:auto}
.modal .actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:8px;border:1px solid var(--gold-line);z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.spin{width:1rem;height:1rem;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line)}
</style>
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%} *{box-sizing:border-box}</style>
</head>
<body>
<div id="app"></div>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
